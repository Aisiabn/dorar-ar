name: Scrape Arabia

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python dorar_arabia.py

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if [ -d "dorar_arabia_output" ] && [ "$(ls -A dorar_arabia_output)" ]; then
            git add dorar_arabia_output/
            git diff --cached --quiet || (
              git commit -m "update: تحديث موسوعة اللغة العربية"
              git pull origin main --rebase
              git push
            )
          else
            echo "⚠️ لا يوجد مخرجات — تحقق من لوج الكود"
            exit 1
          fi